name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: k3s-gift-exchange-dagger
    env:
      DAGGER_X_RELEASE: v1.0.0-beta.25
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Dagger checks
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v1.0.0-beta.25
          verb: check
